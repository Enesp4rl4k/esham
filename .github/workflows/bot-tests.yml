name: Bot Tests

# Bot Python birim testleri (pytest). Anahtarsız ve ağsız çalışır.
# Yalnızca bot/ yolları: içerik/veri commit'leri (web/content, [skip ci]) tetiklemez.
on:
  pull_request:
    paths:
      - "bot/**"
      - ".github/workflows/bot-tests.yml"
  push:
    branches: [master]
    paths:
      - "bot/**"
      - ".github/workflows/bot-tests.yml"
  workflow_dispatch: {}

concurrency:
  group: bot-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "bot/requirements*.txt"
      - name: Bağımlılıklar
        working-directory: bot
        run: pip install --only-binary=:all: -r requirements.txt -r requirements-dev.txt
      - name: pytest
        working-directory: bot
        # `network` işaretli testler dış kaynağa gider ve repo içi veri dosyası yazar; CI'da atlanır.
        run: python -m pytest tests -q -m "not network"
