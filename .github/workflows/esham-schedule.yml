name: Esham Yayın Döngüsü

# Stateless dağıtım: her iş kendi cron'unda çalışır, üretilen raporu commit'ler;
# web platformu (Vercel vb.) commit ile otomatik yeniden derlenir.
# Saatler UTC'dir; TR = UTC+3 (DST yok).
#   05:30 UTC = 08:30 TR  günlük bülten
#   06:30 UTC = 09:30 TR  VİOP açılış
#   07:00 UTC = 10:00 TR  BIST açılış
#   15:15 UTC = 18:15 TR  kapanış
#   Pzt 06:00 UTC = 09:00 TR  haftalık sektör
#   Her 15 dk (hafta içi seans): KAP/haber taraması (tek tur)
#
# Sürekli akış + durum-bağımlı margin-call izleyici için uzun-ömürlü süreç tercih
# edilir: bir VPS'te `py -m esham.main run`. Bu workflow stateless alternatiftir.
on:
  schedule:
    - cron: "30 5 * * 1-5"    # günlük bülten          08:30 TR
    - cron: "45 5 * * 1-5"    # küresel makro raporu    08:45 TR
    - cron: "30 6 * * 1-5"    # VİOP açılış             09:30 TR
    - cron: "0 7 * * 1-5"     # BIST açılış             10:00 TR
    - cron: "0 10 * * 1-5"    # öğle ısı haritası       13:00 TR
    - cron: "15 15 * * 1-5"   # kapanış                 18:15 TR
    - cron: "30 15 * * 1-4"   # akşam ısı haritası      18:30 TR (Pzt-Per)
    - cron: "0 6 * * 1"       # haftalık sektör          09:00 TR (Pazartesi)
    - cron: "30 15 * * 5"     # haftalık özet            18:30 TR (Cuma)
    - cron: "5,20,35,50 6-15 * * 1-5"  # haber/KAP+makro tarama (seans içi)
  workflow_dispatch:
    inputs:
      command:
        description: "Elle çalıştırılacak komut"
        default: "morning-report"
        type: choice
        options:
          - morning-report
          - global-report
          - viop
          - opening
          - closing
          - heatmap
          - sector
          - weekly-summary
          - news-stream

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: esham-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıklar
        working-directory: bot
        run: pip install -r requirements.txt

      - name: Komutu seç ve çalıştır
        working-directory: bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ESHAM_TAKASBANK_VIOP_URL: ${{ secrets.ESHAM_TAKASBANK_VIOP_URL }}
          ESHAM_SITE_URL: https://esham.pages.dev
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          ESHAM_KAP_MIN_IMPORTANCE: "1"
        run: |
          case "${{ github.event.schedule }}" in
            "30 5 * * 1-5")              CMD="morning-report" ;;
            "45 5 * * 1-5")              CMD="global-report" ;;
            "30 6 * * 1-5")              CMD="viop --publish" ;;
            "0 7 * * 1-5")               CMD="opening" ;;
            "0 10 * * 1-5")              CMD="heatmap" ;;
            "15 15 * * 1-5")             CMD="closing" ;;
            "30 15 * * 1-4")             CMD="heatmap" ;;
            "0 6 * * 1")                 CMD="sector" ;;
            "30 15 * * 5")               CMD="weekly-summary" ;;
            "5,20,35,50 6-15 * * 1-5")  CMD="news-stream --once --max-publish 5" ;;
            *)                           CMD="${{ github.event.inputs.command || 'morning-report' }}" ;;
          esac
          echo "Çalıştırılıyor: $CMD"
          python -m esham.main $CMD

      - name: Yeni raporları commit'le
        run: |
          git config user.name "esham-bot"
          git config user.email "bot@esham.local"
          git add web/content/reports web/public/cards web/public/data
          git diff --staged --quiet || git commit -m "content: otomatik yayın (${{ github.event.schedule }})"
          git push

      - name: Node.js Kurulumu (Web Build için)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Web Sitesini Derle ve Cloudflare'e Gönder
        working-directory: web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm ci
          npm run build
          npx wrangler pages deploy out --project-name esham --commit-dirty=true

