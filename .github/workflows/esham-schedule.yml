name: Esham Yayın Döngüsü

# Stateless dağıtım: her iş kendi cron'unda çalışır, üretilen raporu commit'ler;
# web platformu (Cloudflare Pages) sadece içerik değiştiğinde derlenip yayınlanır.
# Saatler UTC'dir; TR = UTC+3 (DST yok).
#   05:30 UTC = 08:30 TR  günlük bülten
#   04:40 UTC = 08:40 TR  e-posta bülteni (SMTP)
#   05:45 UTC = 08:45 TR  küresel makro raporu
#   06:30 UTC = 09:30 TR  VİOP açılış
#   07:00 UTC = 10:00 TR  BIST açılış
#   10:00 UTC = 13:00 TR  öğle ısı haritası
#   15:15 UTC = 18:15 TR  kapanış
#   15:45 UTC = 18:45 TR  hisse finansalları + oranlar (stocks)
#   16:30 UTC = 19:30 TR  TEFAS fonları (funds; fiyatlar akşam yayımlanır)
#   16:50 UTC = 19:50 TR  KAP kâr payı takvimi + pay geri alımları (kap-events; KAP önbelleğini paylaşır)
#   12:50 UTC = 15:50 TR  makro göstergeler (macro; TCMB döviz XML'i 15:30 TR'de yayımlanır)
#   15:30 UTC = 18:30 TR  akşam ısı haritası / haftalık özet
#   Pzt 06:00 UTC = 09:00 TR  haftalık sektör
#   Her 15 dk (hafta içi seans): KAP/haber taraması (tek tur)
on:
  schedule:
    - cron: "30 5 * * 1-5"    # günlük bülten          08:30 TR
    - cron: "40 5 * * 1-5"    # e-posta bülteni (SMTP) 08:40 TR
    - cron: "45 5 * * 1-5"    # küresel makro raporu    08:45 TR
    - cron: "30 6 * * 1-5"    # VİOP açılış             09:30 TR
    - cron: "05 7 * * 1-5"    # BIST açılış (ilk seans verisi) 10:05 TR
    - cron: "15 8 * * 1-5"    # TÜRİB piyasa verisi     11:15 TR
    - cron: "0 10 * * 1-5"    # öğle ısı haritası       13:00 TR
    - cron: "45 11 * * 1-5"   # VİOP gün içi margin call 14:45 TR
    - cron: "30 13 * * 1-5"   # TÜRİB kapanış bülteni   16:30 TR
    - cron: "15 15 * * 1-5"   # kapanış                 18:15 TR
    - cron: "30 15 * * 1-4"   # akşam ısı haritası      18:30 TR (Pzt-Per)
    - cron: "45 15 * * 1-5"   # hisse oranları (stocks)   18:45 TR (kapanış sonrası)
    - cron: "30 16 * * 1-5"   # TEFAS fonları (funds)       19:30 TR
    - cron: "50 16 * * 1-5"   # KAP kâr payı + geri alım (kap-events) 19:50 TR
    - cron: "50 12 * * 1-5"   # makro göstergeler (macro)   15:50 TR
    - cron: "0 6 * * 1"       # haftalık sektör          09:00 TR (Pazartesi)
    - cron: "15 6 * * 1"      # haftalık peer kıyas      09:15 TR (Pazartesi)
    - cron: "30 15 * * 5"     # haftalık özet            18:30 TR (Cuma)
    - cron: "5,20,35,50 6-15 * * 1-5"  # haber/KAP+makro tarama (seans içi)
  workflow_dispatch:
    inputs:
      command:
        description: "Elle çalıştırılacak komut"
        default: "morning-report"
        type: choice
        options:
          - morning-report
          - global-report
          - viop
          - opening
          - closing
          - heatmap
          - sector
          - peer
          - stocks
          - funds
          - kap-events
          - macro
          - newsletter
          - weekly-summary
          - news-stream
          - publish-turib
      dry_run:
        description: "Twitter/Telegram'a GERÇEK gönderi YAPMA (test modu)"
        type: boolean
        default: false
      force_build:
        description: "Değişiklik olmasa bile Web sitesini yeniden derle ve Cloudflare'e gönder"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: esham-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: bot/requirements.txt

      # KAP rapor önbelleği yalnızca hisse oranları (stocks) koşusunda gerekir. `actions/cache` birleşik eylemi
      # kaydı yalnızca iş BAŞARILI bitince yapar: zaman aşımı/hata olunca o koşuda indirilen raporların hepsi kaybolur
      # ve ertesi gün aynı hisseler baştan indirilirdi. Bu yüzden geri yükleme ve kaydetme ayrı, kaydetme `always()`.
      - name: KAP önbelleği (geri yükle)
        if: github.event.schedule == '45 15 * * 1-5' || github.event.schedule == '50 16 * * 1-5' || github.event.inputs.command == 'stocks' || github.event.inputs.command == 'kap-events'
        uses: actions/cache/restore@v4
        with:
          path: bot/cache/kap
          key: kap-cache-${{ github.run_id }}
          restore-keys: kap-cache-

      - name: Bağımlılıklar
        working-directory: bot
        run: pip install -r requirements.txt

      - name: Komutu seç ve çalıştır
        working-directory: bot
        timeout-minutes: 22
        env:
          # KAP istek süre bütçesi (sn): bütçe bitince kalan hisseler sonraki koşuda tamamlanır (önbellek ilerlemeyi korur)
          ESHAM_KAP_BUDGET_SECONDS: "480"
          # TCMB EVDS anahtarı (isteğe bağlı): secret tanımlı değilse boş gelir ve EVDS göstergeleri çekilmez/gösterilmez.
          # Anahtar yalnızca istek başlığında gönderilir, hiçbir log/dosyaya yazılmaz (bot/tests/test_macro_evds.py).
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # dry_run=true ise Twitter keys boş geçilir
          TWITTER_API_KEY: ${{ github.event.inputs.dry_run == 'true' && '' || secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ github.event.inputs.dry_run == 'true' && '' || secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ github.event.inputs.dry_run == 'true' && '' || secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ github.event.inputs.dry_run == 'true' && '' || secrets.TWITTER_ACCESS_SECRET }}
          # TELEGRAM_* bu adıma BİLEREK verilmez: bot koşusu Telegram'a gönderemez, gönderileri giden kutusuna
          # (bot/state/telegram_outbox.json) yazar. Gönderim, yayın kapısı + push başarılı olduktan sonra
          # "Telegram giden kutusu" adımındadır.
          ESHAM_TAKASBANK_VIOP_URL: ${{ secrets.ESHAM_TAKASBANK_VIOP_URL }}
          ESHAM_SITE_URL: https://esham.pages.dev
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          ESHAM_KAP_MIN_IMPORTANCE: "3"
          # E-posta bülteni — tanımlı değilse gönderim dry-run olur (güvenli)
          ESHAM_SMTP_HOST: ${{ secrets.ESHAM_SMTP_HOST }}
          ESHAM_SMTP_PORT: ${{ secrets.ESHAM_SMTP_PORT }}
          ESHAM_SMTP_USER: ${{ secrets.ESHAM_SMTP_USER }}
          ESHAM_SMTP_PASSWORD: ${{ secrets.ESHAM_SMTP_PASSWORD }}
          ESHAM_SMTP_SSL: ${{ secrets.ESHAM_SMTP_SSL }}
          ESHAM_EMAIL_FROM: ${{ secrets.ESHAM_EMAIL_FROM }}
          ESHAM_UNSUBSCRIBE_SECRET: ${{ secrets.ESHAM_UNSUBSCRIBE_SECRET }}
        run: |
          case "${{ github.event.schedule }}" in
            "30 5 * * 1-5")              CMD="morning-report" ;;
            "40 5 * * 1-5")              CMD="newsletter" ;;
            "45 5 * * 1-5")              CMD="global-report" ;;
            "30 6 * * 1-5")              CMD="viop --publish" ;;
            "05 7 * * 1-5")              CMD="opening" ;;
            "15 8 * * 1-5")              CMD="publish-turib" ;;
            "0 10 * * 1-5")              CMD="heatmap" ;;
            "45 11 * * 1-5")             CMD="viop --publish" ;;
            "30 13 * * 1-5")             CMD="publish-turib" ;;
            "15 15 * * 1-5")             CMD="closing" ;;
            "30 15 * * 1-4")             CMD="heatmap" ;;
            "45 15 * * 1-5")             CMD="stocks --workers 3" ;;
            "30 16 * * 1-5")             CMD="funds --limit 200" ;;
            "50 16 * * 1-5")             CMD="kap-events" ;;
            "50 12 * * 1-5")             CMD="macro" ;;
            "0 6 * * 1")                 CMD="sector" ;;
            "15 6 * * 1")
              # Haftalık peer kıyası — sektör ISO haftasına göre döner
              SEC=$(python -c "from esham.sources.peer import sector_for_today; print(sector_for_today())")
              CMD="peer --sector $SEC"
              ;;
            "30 15 * * 5")               CMD="weekly-summary" ;;
            "5,20,35,50 6-15 * * 1-5")  CMD="news-stream --once --max-publish 5" ;;
            *)
              _RAW="${{ github.event.inputs.command || 'morning-report' }}"
              if [ "$_RAW" = "news-stream" ]; then
                CMD="news-stream --once --max-publish 10"
              else
                CMD="$_RAW"
              fi
              ;;
          esac
          # Hisse oranları: önce KAP finansalları (birincil kaynak), olmazsa Yahoo ile devam (görünür uyarıyla)
          case "$CMD" in
            stocks*)
              if ! timeout 11m python -m esham.main kap-financials --workers 3; then
                echo "::warning title=KAP verisi alınamadı::Hisse oranları mevcut KAP dosyaları / Yahoo ile hesaplanacak"
              fi
              ;;
          esac
          echo "Çalıştırılıyor: $CMD"
          python -m esham.main $CMD

      - name: KAP önbelleği (kaydet)
        if: always() && (github.event.schedule == '45 15 * * 1-5' || github.event.schedule == '50 16 * * 1-5' || github.event.inputs.command == 'stocks' || github.event.inputs.command == 'kap-events')
        uses: actions/cache/save@v4
        with:
          path: bot/cache/kap
          key: kap-cache-${{ github.run_id }}

      - name: Veri tazeliği ölçümü (bölüm bazında; eski/eksik görünür olur, yayını durdurmaz)
        working-directory: bot
        run: python -m esham.main data-status

      # Sıra: bot koşusu (gönderim YOK) → yayın kapısı → commit + push → derleme/dağıtım → Telegram gönderimi.
      # Yayın kapısı: web testleri (tarafsız dil, rapor biçimi, dizin kuralları) bu koşunun ürettiği yeni raporlarla
      # birlikte koşar. Geçmezse raporlar commit'lenmez, Telegram'a hiçbir şey gitmez, iş KIRMIZI olur; yalnız döngüyü
      # durduran durum commit'lenir (bkz. "Yayın kapısı kırıldı" adımı ve bot/esham/publish_gate.py). Testler
      # `node --test` ile çalışır, bağımlılık kurulumu gerekmez.
      - name: Node.js Kurulumu (yayın kapısı + web derlemesi)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Yayın kapısı (yeni raporlar web testlerinden geçmeli)
        id: gate
        run: |
          if [ -z "$(git status --porcelain -- web/content/reports)" ]; then
            echo "Yeni/değişen rapor yok; kapı atlandı."
          else
            cd web && npm test
          fi

      # Kapı kırıldı: raporlar ve veri dosyaları COMMIT'LENMEZ, Telegram'a hiçbir şey gitmez. Döngüyü durdurmak için
      # yalnız durum + giden kutusu commit'lenir: bu koşunun gönderileri silinir, yayınlanan her KAP bildirimi
      # `gate_failures` sayacına yazılır; 3. kırılışta `failed_disclosures`'a (neden + deneme sayısı) düşer ve bir
      # daha denenmez. Böylece kırık bir rapor her 15 dakikada yeniden üretilip gönderilmez.
      - name: Yayın kapısı kırıldı (yalnız döngüyü durduran durumu commit'le)
        if: failure() && steps.gate.outcome == 'failure'
        working-directory: bot
        run: |
          python -m esham.main outbox-gate-failed --reason "Yayın kapısı: web testleri kırıldı (koşu ${{ github.run_id }})"
          cd ..
          if [ "$GITHUB_REF_NAME" = "master" ]; then
            if ! bash .github/scripts/commit-push.sh "state: yayın kapısı kırıldı, raporlar yayınlanmadı (${{ github.event.schedule || github.event.inputs.command }}) [skip ci]" \
                bot/state/esham_state.json bot/state/telegram_outbox.json; then
              echo "::error title=Durum push edilemedi::Kapı kırıldı ve durum da push edilemedi; sonraki koşu bildirimi yeniden dener (Telegram'a yine bir şey gitmez)."
            fi
          fi
          echo "::error title=Yayın kapısı kırıldı::Yeni raporlar web testlerinden geçmedi. Raporlar commit'lenmedi, Telegram'a hiçbir şey gönderilmedi. Ayrıntı: 'Yayın kapısı' adımının çıktısı ve bot/state/esham_state.json → last_gate_failure."
          exit 1

      - name: Yeni raporları ve durumu commit'le
        id: commit_step
        run: |
          if [ "$GITHUB_REF_NAME" != "master" ]; then
            echo "::notice title=Push atlandı::Çalışma dalı $GITHUB_REF_NAME (master değil); içerik commit'i ve Telegram gönderimi yalnızca master'da yapılır."
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "can_send=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          paths="web/content/reports web/public/cards web/public/data web/public/reports bot/state/esham_state.json bot/state/telegram_outbox.json"
          # Eşzamanlı push yarışı için 3 deneme; sonunda başarısızsa iş KIRMIZI olur ve Telegram adımı ÇALIŞMAZ.
          # Hiçbir şey push edilmediği için sonraki koşu aynı bildirimi baştan işler: kayıp da tekrar gönderi de yok.
          if ! result=$(bash .github/scripts/commit-push.sh "content: otomatik yayın (${{ github.event.schedule || github.event.inputs.command }}) [skip ci]" $paths); then
            echo "::error title=Push başarısız::İçerik commit'i master'a gönderilemedi (3 deneme). Telegram'a hiçbir şey gönderilmedi."
            exit 1
          fi
          if [ "$result" = "pushed" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "Herhangi bir yeni içerik veya durum değişikliği yok."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi
          echo "can_send=true" >> $GITHUB_OUTPUT

      - name: Web sitesini derle (+ dosya bütçesi)
        if: steps.commit_step.outputs.has_changes == 'true' || github.event.inputs.force_build == 'true'
        working-directory: web
        env:
          NEXT_PUBLIC_ESHAM_BOT_URL: ${{ secrets.ESHAM_BOT_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          NEXT_PUBLIC_CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
          NEXT_PUBLIC_GSC_VERIFICATION: ${{ vars.GSC_VERIFICATION }}
        # `continue-on-error` KALDIRILDI: derleme veya dosya bütçesi (Cloudflare 20.000 sınırı) bozulursa iş kırmızı olur
        run: |
          npm ci
          npm run build

      - name: Cloudflare Pages'e gönder
        if: steps.commit_step.outputs.has_changes == 'true' || github.event.inputs.force_build == 'true'
        working-directory: web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning title=Dağıtım atlandı::Cloudflare secrets tanımlı değil (build başarılı)"
            exit 0
          fi
          npx wrangler pages deploy out --project-name esham --commit-dirty=true

      # Telegram: yalnız raporlar master'a push edildikten (ve derleme/dağıtım başarılı ya da gereksizken) SONRA.
      # En fazla bir kez (at-most-once) teslim:
      #   1) claim: bekleyen kayıtlar bu koşu adına `in_flight` yapılır ve bu işaret PUSH edilir (gönderimden önce);
      #      push edilemezse hiçbir şey gönderilmez, kayıtlar origin'de `pending` kalır, sonraki koşu gönderir.
      #   2) deliver: gönder, her kaydı sent / pending (kesin ret, en çok 3 deneme) / unknown (belirsiz) işaretle.
      #   3) sonuç push edilir. Push edilemez ya da iş çökerse origin'de `in_flight` kalır; sonraki koşu bunu
      #      `unknown` yapar ve YENİDEN GÖNDERMEZ (tekrar eden gönderi yerine kaçan gönderi).
      # Derleme/dağıtım kırılırsa bu adım çalışmaz; kayıtlar bekler, sonraki koşu gönderir (6 saatten eskiyse göndermez).
      - name: Telegram giden kutusu (push sonrası gönderim)
        if: success() && steps.commit_step.outputs.can_send == 'true'
        working-directory: bot
        env:
          # dry_run=true ise boş: kayıtlar gönderilmeden `skipped` işaretlenir (sonra da gönderilmez).
          TELEGRAM_BOT_TOKEN: ${{ github.event.inputs.dry_run == 'true' && '' || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ github.event.inputs.dry_run == 'true' && '' || secrets.TELEGRAM_CHAT_ID }}
          ESHAM_SITE_URL: https://esham.pages.dev
        run: |
          claimed=$(python -m esham.main send-outbox --phase claim | sed -n 's/.*claimed=\([0-9]*\).*/\1/p')
          echo "Gönderilecek kayıt: ${claimed:-0}"
          cd ..
          if ! bash .github/scripts/commit-push.sh "state: Telegram giden kutusu, gönderim öncesi işaret [skip ci]" bot/state/telegram_outbox.json > /dev/null; then
            echo "::warning title=Telegram gönderilmedi::Gönderim öncesi işaret push edilemedi; hiçbir şey gönderilmedi, sonraki koşu deneyecek."
            exit 0
          fi
          if [ "${claimed:-0}" = "0" ]; then exit 0; fi
          (cd bot && python -m esham.main send-outbox --phase deliver)
          if ! bash .github/scripts/commit-push.sh "state: Telegram gönderim sonucu [skip ci]" bot/state/telegram_outbox.json > /dev/null; then
            echo "::error title=Gönderim sonucu push edilemedi::Gönderildi ama kayıt master'a yazılamadı. Tekrar gönderi OLMAZ: sonraki koşu bu kayıtları 'unknown' sayar."
            exit 1
          fi
